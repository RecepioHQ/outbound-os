name: Verify Official MCP Registry Listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify active registry listing without republishing
        run: node scripts/verify-official-mcp-registry.mjs --retry
